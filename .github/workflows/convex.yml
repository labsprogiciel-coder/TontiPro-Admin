# Convex backend CI.
# - Pull requests: build the web app, then deploy the branch to its own Convex
#   preview deployment (seeded with mock data). Never touches production.
# - Push to main: deploy to production, then re-apply role definitions to
#   existing users (convex-authz keeps a copy of each role's permissions).
# Only this repo deploys the backend; the mobile app must not.
# Secrets: CONVEX_DEPLOY_KEY (production), CONVEX_PREVIEW_DEPLOY_KEY (preview).
name: Convex

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: convex-preview-${{ github.head_ref }}
      cancel-in-progress: true
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm run build
      # Secrets aren't available to pull requests from forks. Preview deploy
      # keys start with "preview:"; a dev or prod key is refused by Convex.
      - name: Deploy to Convex preview
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            "") echo "::notice::No CONVEX_PREVIEW_DEPLOY_KEY (fork PR?); skipping preview deploy"; exit 0 ;;
            preview:*) ;;
            *) echo "::warning::CONVEX_PREVIEW_DEPLOY_KEY is not a preview deploy key (it starts with '${CONVEX_DEPLOY_KEY%%:*}:'). Generate one under Convex dashboard > Project settings > Preview deploy keys and update the secret. Skipping preview deploy."; exit 0 ;;
          esac
          npx convex deploy \
            --preview-create "${{ github.head_ref }}" \
            --preview-run seed:seedDatabase

  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: convex-production
      cancel-in-progress: false
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Refuse anything but a production key so main never lands on a dev deployment
      - name: Deploy to Convex production
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            prod:*|project:*) ;;
            *) echo "::error::CONVEX_DEPLOY_KEY must be a production or project deploy key (prod:... or project:...). Get it from the production deployment's settings in the Convex dashboard."; exit 1 ;;
          esac
          npx convex deploy
      - name: Sync role permissions
        run: npx convex run users:syncRolePermissions
